services:
  - type: web
    name: invest-ai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # O Render vai pedir para você colar a URL do Neon
      - key: PYTHON_VERSION
        value: "3.13.0"